name: Build APK release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="BetterBoni-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --verify-tag \
            --title "BetterBoni ${GITHUB_REF_NAME}" \
            --notes "First BetterBoni Android preview. Download the attached debug APK to install on Android 11 or newer. LLM endpoints, models and API keys are configured in the app; no credentials are bundled."
